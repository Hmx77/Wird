name: Apply reviewed premium redesign patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Hmx77/Wird' && github.ref == 'refs/heads/redesign/premium-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Block cloud metadata
        run: bash tool/ci/block_metadata.sh
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          python3 - <<'PYIMPORT'
          import hashlib,json,pathlib,zipfile,subprocess,stat
          archive=pathlib.Path('Wird_Redesign_Patch.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='b98e39e98b7b8425c35072d788bb4942166c37763374dc96b3407b9807392556'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              m=json.loads(z.read('_manifest.json'))
              assert m['base_commit']=='8656ab8f0d0341acb1e1f05071713b5da1b1f80e'
              allowed=['.github/workflows/release-android.yml', '.github/workflows/verify.yml', 'android/app/src/main/res/drawable-v21/launch_background.xml', 'android/app/src/main/res/drawable/launch_background.xml', 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', 'android/app/src/main/res/values-night-v31/styles.xml', 'android/app/src/main/res/values-night/styles.xml', 'android/app/src/main/res/values-v31/styles.xml', 'android/app/src/main/res/values/brand_colors.xml', 'android/app/src/main/res/values/styles.xml', 'assets/fonts/NotoSansArabic.ttf', 'assets/fonts/OFL.txt', 'docs/REDESIGN_TRACEABILITY.md', 'docs/redesign-content-manifest.csv', 'ios/Runner/Base.lproj/LaunchScreen.storyboard', 'lib/feature_panels.dart', 'lib/main.dart', 'lib/premium_ui.dart', 'lib/ui_strings.dart', 'pubspec.yaml', 'test/reader_test.dart', 'test/redesign_test.dart', 'tool/brand_assets_test.dart', 'tool/build-windows.ps1', 'tool/ci/android_device_smoke.sh', 'tool/ci/verify.sh', 'tool/content_check.dart', 'tool/export_catalog.dart', 'tool/release.sh']
              assert set(z.namelist())==set(allowed)|{'_manifest.json'}
              assert {f['path'] for f in m['files']}==set(allowed)
              for f in m['files']:
                  name=f['path']; p=pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16)
                  if f['base_sha256'] is None:
                      assert not p.exists(), 'Unexpected existing file: '+name
                  else:
                      assert p.is_file(), 'Missing baseline file: '+name
                      assert hashlib.sha256(p.read_bytes().rstrip(b'\r\n')).hexdigest()==f['base_sha256'], 'Baseline changed: '+name
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==f['sha256']
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Applied reviewed patch with baseline/hash/path checks.')
          PYIMPORT
      - name: Commit only reviewed changes and remove one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore -- .github/workflows/release-android.yml .github/workflows/verify.yml
          git add -- android/app/src/main/res/drawable-v21/launch_background.xml android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/values-night-v31/styles.xml android/app/src/main/res/values-night/styles.xml android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values/brand_colors.xml android/app/src/main/res/values/styles.xml assets/fonts/NotoSansArabic.ttf assets/fonts/OFL.txt docs/REDESIGN_TRACEABILITY.md docs/redesign-content-manifest.csv ios/Runner/Base.lproj/LaunchScreen.storyboard lib/feature_panels.dart lib/main.dart lib/premium_ui.dart lib/ui_strings.dart pubspec.yaml test/reader_test.dart test/redesign_test.dart tool/brand_assets_test.dart tool/build-windows.ps1 tool/ci/android_device_smoke.sh tool/ci/verify.sh tool/content_check.dart tool/export_catalog.dart tool/release.sh
          git rm -- Wird_Redesign_Patch.zip
          git commit -m 'Implement premium Wird redesign with preserved content and data'
          git push origin HEAD:redesign/premium-20261013
