name: Inspect emulator startup diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'Hmx77/Wird' && github.ref == 'refs/heads/redesign/premium-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tool/ci/block_metadata.sh
      - uses: actions/download-artifact@v4
        with:
          name: wird-android-device-review
          path: native-diagnostics
          run-id: 38434785370
          github-token: ${{ github.token }}
      - name: Read only emulator startup errors
        shell: python
        run: |
          import pathlib, re
          p=pathlib.Path('native-diagnostics/emulator.log')
          assert p.is_file()
          for line in p.read_text(errors='replace').splitlines()[-100:]:
              if not re.search(r'(?i)(token|password|secret|authorization|jwt)', line):
                  print(line)
