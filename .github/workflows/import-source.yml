name: Restore supplied Gradle wrapper
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original wrapper files from validated source
        shell: python
        run: |
          import hashlib, io, subprocess, zipfile
          from pathlib import Path
          data = subprocess.check_output(['git', 'show', '753b1ef896d7e57aa00630630a33bc3ca59c4fc3:Wird_Source_Validated.zip'])
          assert hashlib.sha256(data).hexdigest() == '8351e8bf7116284884e0b2fe4338ca44710d25faa2e9b7941ebe947d696e9a10'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in ['android/gradlew', 'android/gradlew.bat', 'android/gradle/wrapper/gradle-wrapper.jar']:
                  Path(name).write_bytes(archive.read('wird_flutter_starter/' + name))
          Path('android/gradlew').chmod(0o755)
          ignore = Path('android/.gitignore')
          ignore.write_text('\n'.join(line for line in ignore.read_text().splitlines() if line not in ['gradle-wrapper.jar', '/gradlew', '/gradlew.bat']) + '\n')
      - name: Commit restored wrapper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/.gitignore android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar
          git commit -m 'Track supplied Gradle wrapper and correct starter ignore rules'
          git push origin HEAD:main
