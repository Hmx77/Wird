name: Signed Android artifacts (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused hosted-runner toolchains for Android packaging
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - run: bash tool/ci/block_metadata.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Require existing signing material
        env:
          WIRD_KEYSTORE_BASE64: ${{ secrets.WIRD_KEYSTORE_BASE64 }}
          WIRD_STORE_PASSWORD: ${{ secrets.WIRD_STORE_PASSWORD }}
          WIRD_KEY_PASSWORD: ${{ secrets.WIRD_KEY_PASSWORD }}
          WIRD_KEY_ALIAS: ${{ secrets.WIRD_KEY_ALIAS }}
        run: python3 tool/ci/prepare_signing.py
      - name: Validate and build signed artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wird-home"
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            JAVA_HOME="$JAVA_HOME" CI=true LANG=C.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            bash -euo pipefail -c 'bash tool/ci/verify.sh validate; flutter build apk --release; flutter build appbundle --release'
      - uses: actions/upload-artifact@v4
        with:
          name: wird-signed-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/wird-upload.jks"
