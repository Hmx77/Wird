name: Wird verification
on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_ios_run:
        description: Existing successful iOS run for the review gallery
        type: string
        default: ""
      reuse_android_run:
        description: Existing APK run for native recheck with Android build disabled
        type: string
        default: ""
      reader_only:
        description: Focused Reader recheck using an existing APK; report prior Home and Settings checks separately
        type: boolean
        default: false
      build_android:
        description: Validate and build Android debug APK
        type: boolean
        default: true
      build_ios:
        description: Also validate unsigned iOS on macOS
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wird-verify-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && !inputs.build_android && !inputs.build_ios && inputs.reuse_android_run != '' && 'native' || github.event_name == 'workflow_dispatch' && !inputs.build_android && 'ios' || 'all' }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused hosted-runner toolchains for Android packaging
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Block cloud metadata before tool startup
        run: bash tool/ci/block_metadata.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Verify and build in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wird-home" verification
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            JAVA_HOME="$JAVA_HOME" CI=true LANG=C.UTF-8 \
            FLUTTER_SUPPRESS_ANALYTICS=true \
            bash tool/ci/verify.sh debug 2>&1 | tee verification/android.log
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual logs and dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-android-verification
          path: |
            verification/
            android/app/src/main/res/mipmap-*/
            android/app/src/main/res/drawable-nodpi/
            ios/Runner/Assets.xcassets/
            assets/brand/wird_wordmark.png
            pubspec.lock
          if-no-files-found: warn
          retention-days: 14
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block cloud metadata before tool startup
        run: bash tool/ci/block_metadata.sh
      - name: Select installed Xcode 26.3 for current App Store SDK requirements
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Verify unsigned iOS in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wird-home" verification
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            CI=true LANG=en_US.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            COCOAPODS_DISABLE_STATS=true \
            bash tool/ci/verify.sh ios 2>&1 | tee verification/ios.log
      - name: Build and launch iOS simulator in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            CI=true LANG=en_US.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            COCOAPODS_DISABLE_STATS=true \
            flutter build ios --simulator --debug --no-codesign 2>&1 | tee verification/ios-simulator-build.log
          bash tool/ci/ios_simulator_smoke.sh
      - name: Preserve iOS verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-ios-verification
          path: |
            verification/
            android/app/src/main/res/mipmap-*/
            android/app/src/main/res/drawable-nodpi/
            ios/Runner/Assets.xcassets/
            assets/brand/wird_wordmark.png
            pubspec.lock
            ios/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
  android-device:
    needs: android
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/redesign/') && (needs.android.result == 'success' || (!inputs.build_android && inputs.reuse_android_run != ''))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused hosted-runner toolchains for emulator storage
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Block cloud metadata
        run: bash tool/ci/block_metadata.sh
      - uses: actions/download-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Android emulator offline native smoke test
        env:
          WIRD_READER_ONLY: ${{ inputs.reader_only && !inputs.build_android && inputs.reuse_android_run != '' && 'true' || 'false' }}
        run: bash tool/ci/android_device_smoke.sh
      - name: Upload verified debug APK on native recheck
        if: ${{ always() && !inputs.build_android && inputs.reuse_android_run != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Preserve actual native screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-android-device-review
          path: verification/device/
          retention-days: 14
          if-no-files-found: warn
  review-assets:
    needs: [android, android-device, ios]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/redesign/premium-tasbih-20261019' && (needs.android.result == 'success' || (needs.android.result == 'skipped' && inputs.reuse_android_run != '')) && (needs['android-device'].result == 'success' || needs['android-device'].result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Block cloud metadata
        run: bash tool/ci/block_metadata.sh
      - uses: actions/download-artifact@v4
        with:
          name: wird-android-verification
          path: reviewed-output
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: wird-android-device-review
          path: reviewed-native
      - uses: actions/download-artifact@v4
        if: inputs.build_ios || inputs.reuse_ios_run != ''
        continue-on-error: true
        with:
          name: wird-ios-verification
          path: reviewed-ios
          run-id: ${{ inputs.reuse_ios_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Preserve verified native artwork and visual review images
        env:
          WIRD_COPY_FORMATTED: ${{ needs.android.result == 'success' && 'true' || 'false' }}
        shell: python
        run: |
          import pathlib, shutil, os
          root = pathlib.Path('reviewed-output')
          patterns = ['assets/brand/wird_wordmark.png', 'android/app/src/main/res/mipmap-*/ic_launcher.png',
                      'android/app/src/main/res/drawable-nodpi/wird*.png',
                      'ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png',
                      'ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png']
          count = 0
          for pattern in patterns:
              for source in root.glob(pattern):
                  target = pathlib.Path(source.relative_to(root))
                  assert source.is_file() and not source.is_symlink()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  count += 1
          assert count >= 20, 'Missing native artwork'
          for source in (root / 'verification/screenshots').glob('*.png'):
              target = pathlib.Path('docs/review-images') / source.name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          assert pathlib.Path('docs/review-images/home-ar-430.png').is_file()
          if os.environ['WIRD_COPY_FORMATTED'] == 'true':
            for name in ['lib/settings_ui.dart', 'lib/feature_panels.dart', 'lib/ui_strings.dart',
                         'lib/reading_ui.dart', 'lib/tasbih_ui.dart', 'test/tasbih_premium_test.dart', 'test/reading_premium_test.dart',
                         'test/settings_premium_test.dart', 'test/redesign_test.dart']:
                source = root / 'verification/settings-source' / (name + '.txt')
                assert source.is_file() and not source.is_symlink(), 'Missing tested formatted Settings source'
                shutil.copyfile(source, pathlib.Path(name))
          for folder, label in [('reviewed-native', 'android-native'),
                                ('reviewed-ios/verification/ios-device', 'ios-native')]:
              destination = pathlib.Path('docs/review-images') / label
              destination.mkdir(parents=True, exist_ok=True)
              for old in destination.iterdir():
                  if old.suffix == '.png' or old.name in ['startup.mp4', 'startup-timeline.json', 'tasbih-interactions.mp4', 'tasbih-interactions.json']:
                      old.unlink()
              for source in pathlib.Path(folder).glob('*'):
                  if source.suffix != '.png' and source.name not in ['startup.mp4', 'startup-timeline.json', 'tasbih-interactions.mp4', 'tasbih-interactions.json']:
                      continue
                  assert source.is_file() and not source.is_symlink()
                  target = pathlib.Path('docs/review-images') / label / source.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
      - name: Commit reviewed outputs only on the unchanged review branch
        run: |
          test "$(git ls-remote origin refs/heads/redesign/premium-tasbih-20261019 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- lib/tasbih_ui.dart test/tasbih_premium_test.dart lib/reading_ui.dart test/reading_premium_test.dart lib/settings_ui.dart lib/feature_panels.dart lib/ui_strings.dart test/settings_premium_test.dart test/redesign_test.dart assets/brand/wird_wordmark.png android/app/src/main/res/mipmap-*/ic_launcher.png android/app/src/main/res/drawable-nodpi/wird*.png ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png docs/review-images/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve actual native captures and generated branding'
            git push origin HEAD:redesign/premium-tasbih-20261019
          fi


