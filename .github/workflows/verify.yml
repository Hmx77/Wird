name: Wird verification
on:
  push:
    branches: [main, "redesign/**", "review/athkar-authentication-20261026"]
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_ios_run:
        description: Existing successful iOS run for the review gallery
        type: string
        default: ""
      reuse_android_run:
        description: Existing APK run for native recheck with Android build disabled
        type: string
        default: ""
      reader_only:
        description: Focused Reader recheck using an existing APK; report prior Home and Settings checks separately
        type: boolean
        default: false
      build_android:
        description: Validate and build Android debug APK
        type: boolean
        default: true
      build_ios:
        description: Also validate unsigned iOS on macOS
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wird-verify-${{ github.ref }}-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && !inputs.build_android && !inputs.build_ios && inputs.reuse_android_run != '' && 'native' || github.event_name == 'workflow_dispatch' && !inputs.build_android && 'ios' || 'all' }}
  cancel-in-progress: false
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free unused hosted-runner toolchains for Android packaging
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Block cloud metadata before tool startup
        run: bash tool/ci/block_metadata.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Verify and build in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wird-home" verification
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            JAVA_HOME="$JAVA_HOME" CI=true LANG=C.UTF-8 \
            FLUTTER_SUPPRESS_ANALYTICS=true \
            bash tool/ci/verify.sh debug 2>&1 | tee verification/android.log
      - name: Validate fresh APK and record exact source revision
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk
          git rev-parse HEAD | tee verification/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee verification/apk-sha256.txt
      - name: Build previous source with the same disposable debug signing key for upgrade verification
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            JAVA_HOME="$JAVA_HOME" CI=true LANG=C.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            bash tool/ci/build_upgrade_baseline.sh 2>&1 | tee verification/upgrade-baseline-build.log
      - name: Preserve explicitly labeled upgrade-test baseline
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wird-upgrade-baseline
          path: build/upgrade-baseline/
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual logs and dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-android-verification
          path: |
            verification/
            android/app/src/main/res/mipmap-*/
            android/app/src/main/res/drawable-nodpi/
            ios/Runner/Assets.xcassets/
            assets/brand/wird_wordmark.png
            pubspec.lock
          if-no-files-found: warn
          retention-days: 14
  ios:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/redesign/ivory-settings-integration-20261024' || github.ref == 'refs/heads/review/athkar-authentication-20261026' || github.ref == 'refs/heads/redesign/graded-reference-entries-20261026')) || (github.event_name == 'workflow_dispatch' && inputs.build_ios)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Block cloud metadata before tool startup
        run: bash tool/ci/block_metadata.sh
      - name: Select installed Xcode 26.3 for current App Store SDK requirements
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Verify unsigned iOS in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wird-home" verification
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            CI=true LANG=en_US.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            COCOAPODS_DISABLE_STATS=true \
            bash tool/ci/verify.sh ios 2>&1 | tee verification/ios.log
      - name: Build and launch iOS simulator in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$RUNNER_TEMP/wird-home" PATH="$PATH" \
            CI=true LANG=en_US.UTF-8 FLUTTER_SUPPRESS_ANALYTICS=true \
            COCOAPODS_DISABLE_STATS=true \
            flutter build ios --simulator --debug --no-codesign 2>&1 | tee verification/ios-simulator-build.log
          bash tool/ci/ios_simulator_smoke.sh
      - name: Preserve iOS verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-ios-verification
          path: |
            verification/
            android/app/src/main/res/mipmap-*/
            android/app/src/main/res/drawable-nodpi/
            ios/Runner/Assets.xcassets/
            assets/brand/wird_wordmark.png
            pubspec.lock
            ios/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
  android-device:
    needs: android
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/redesign/ivory-settings-integration-20261024' || github.ref == 'refs/heads/review/athkar-authentication-20261026' || github.ref == 'refs/heads/redesign/graded-reference-entries-20261026'))) && (startsWith(github.ref, 'refs/heads/redesign/') || github.ref == 'refs/heads/review/athkar-authentication-20261026') && (needs.android.result == 'success' || (!inputs.build_android && inputs.reuse_android_run != ''))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused hosted-runner toolchains for emulator storage
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Block cloud metadata
        run: bash tool/ci/block_metadata.sh
      - uses: actions/download-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download previous-source upgrade fixture
        uses: actions/download-artifact@v4
        with:
          name: wird-upgrade-baseline
          path: build/upgrade-baseline
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Android emulator offline native smoke test
        env:
          WIRD_READER_ONLY: ${{ inputs.reader_only && !inputs.build_android && inputs.reuse_android_run != '' && 'true' || 'false' }}
        run: bash tool/ci/android_device_smoke.sh
      - name: Upload verified debug APK on native recheck
        if: ${{ always() && !inputs.build_android && inputs.reuse_android_run != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wird-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Emit actual native screenshot previews for visual review
        if: always()
        run: python3 tool/ci/print_native_previews.py
      - name: Preserve actual native screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wird-android-device-review
          path: verification/device/
          retention-days: 14
          if-no-files-found: warn
