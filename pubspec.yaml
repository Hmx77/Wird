name: wird
description: Wird — ورد, private offline Arabic Athkar.
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.3
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
  flutter_timezone: 4.1.1
  just_audio: 0.10.5
  share_plus: 11.1.0
  home_widget: 0.8.0
  url_launcher: 6.3.2
  crypto: 3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/brand/wird_logo.png
    - assets/audio/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/wird_logo.png
  remove_alpha_ios: true
